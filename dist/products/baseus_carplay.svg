<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="deviceBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e37" />
      <stop offset="50%" stop-color="#181b22" />
      <stop offset="100%" stop-color="#0f1115" />
    </linearGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="ledGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
    <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />

  <!-- Shadow below adapter -->
  <ellipse cx="200" cy="330" rx="100" ry="20" fill="#64748b" opacity="0.2" filter="blur(8px)" />

  <!-- USB Cable curving out top -->
  <path d="M 200 135 C 200 90, 260 70, 260 40" fill="none" stroke="url(#cableGrad)" stroke-width="12" stroke-linecap="round" />
  <!-- USB Metal Connector -->
  <rect x="250" y="16" width="20" height="26" rx="3" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" />
  <rect x="254" y="24" width="4" height="6" rx="1" fill="#475569" />
  <rect x="262" y="24" width="4" height="6" rx="1" fill="#475569" />
  <!-- Strain Relief Boot -->
  <rect x="194" y="126" width="12" height="14" rx="3" fill="#1e293b" />

  <!-- Main Adapter Body -->
  <g filter="url(#dropShadow)">
    <!-- Outer metallic rim -->
    <rect x="110" y="130" width="180" height="180" rx="42" fill="url(#metalRim)" />
    <!-- Front Face -->
    <rect x="114" y="134" width="172" height="172" rx="38" fill="url(#deviceBody)" />
    
    <!-- Subtle Inner Border Highlight -->
    <rect x="116" y="136" width="168" height="168" rx="36" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

    <!-- Brand Name "Baseus" -->
    <text x="200" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" letter-spacing="3" fill="#f8fafc" text-anchor="middle">BASEUS</text>

    <!-- Wireless CarPlay Signal Icon -->
    <g transform="translate(200, 222)">
      <!-- Car / Display Silhouette -->
      <path d="M -24 6 C -24 -6, -20 -14, -8 -16 L 8 -16 C 20 -14, 24 -6, 24 6 L 24 10 C 24 14, 20 16, 16 16 L -16 16 C -20 16, -24 14, -24 10 Z" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" />
      <line x1="-12" y1="20" x2="12" y2="20" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
      <line x1="0" y1="16" x2="0" y2="20" stroke="#94a3b8" stroke-width="2.5" />
      
      <!-- Wireless Waves -->
      <path d="M -12 -5 C -8 -9, 8 -9, 12 -5" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <path d="M -6 -1 C -4 -3, 4 -3, 6 -1" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="0" cy="4" r="2" fill="#38bdf8" />
    </g>

    <!-- Glowing Status Indicator LED -->
    <circle cx="200" cy="275" r="4.5" fill="url(#ledGlow)" filter="url(#glowEffect)" />
    <circle cx="200" cy="275" r="2" fill="#e0f2fe" />
  </g>

  <!-- Feature Badge Bottom Corner -->
  <g transform="translate(26, 342)">
    <rect width="138" height="26" rx="13" fill="#0284c7" fill-opacity="0.12" stroke="#0284c7" stroke-width="1.2" />
    <circle cx="16" cy="13" r="4" fill="#0284c7" />
    <text x="27" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0369a1">Wireless CarPlay</text>
  </g>
</svg>
