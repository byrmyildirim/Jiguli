<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="25%" stop-color="#0f172a"/>
      <stop offset="75%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="12" stdDeviation="10" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>

  <!-- Main Doorbell (Black Unit) -->
  <g filter="url(#shadow)">
    <!-- Outer Housing with Canopy Roof -->
    <path d="M 120 70 L 260 70 L 260 410 C 260 425, 245 435, 230 435 L 150 435 C 135 435, 120 425, 120 410 Z" fill="#090d16"/>
    <!-- Top Weather Shield / Hood -->
    <path d="M 110 65 L 270 65 C 275 65, 275 75, 265 80 L 115 80 C 105 75, 105 65, 110 65 Z" fill="#1e293b"/>
    
    <!-- Body Panel -->
    <rect x="130" y="85" width="120" height="335" rx="14" fill="url(#bodyGrad)"/>
    
    <!-- Glossy Top Glass for Camera -->
    <rect x="140" y="95" width="100" height="130" rx="10" fill="#050811"/>
    
    <!-- Camera Bezel & Lens -->
    <circle cx="190" cy="145" r="26" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="190" cy="145" r="18" fill="url(#lensGrad)"/>
    <circle cx="190" cy="145" r="8" fill="#020617"/>
    <circle cx="186" cy="141" r="3.5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="194" cy="149" r="1.5" fill="#ffffff" opacity="0.9"/>
    
    <!-- IR LED Indicators & Sensor -->
    <circle cx="190" cy="108" r="3.5" fill="#dc2626" opacity="0.6"/>
    <circle cx="160" cy="145" r="3" fill="#1e293b"/>
    <circle cx="220" cy="145" r="3" fill="#1e293b"/>
    <circle cx="190" cy="185" r="4.5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="175" y="202" width="30" height="3" rx="1.5" fill="#334155"/>

    <!-- Microphone Pin Hole -->
    <circle cx="190" cy="245" r="2" fill="#050811"/>

    <!-- Bottom Illuminated Call Button with Bell Icon -->
    <circle cx="190" cy="340" r="34" fill="#0b1120" stroke="url(#blueGlow)" stroke-width="3.5" filter="url(#shadow)"/>
    <circle cx="190" cy="340" r="26" fill="#0284c7" opacity="0.2"/>
    <!-- Bell Icon Inside Button -->
    <path d="M 190 326 C 185 326, 182 330, 182 336 L 178 348 L 202 348 L 198 336 C 198 330, 195 326, 190 326 Z" fill="#38bdf8"/>
    <circle cx="190" cy="351" r="2.5" fill="#38bdf8"/>
    
    <!-- Speaker Slits at Bottom -->
    <rect x="170" y="395" width="40" height="2" rx="1" fill="#334155"/>
    <rect x="175" y="401" width="30" height="2" rx="1" fill="#334155"/>
  </g>

  <!-- Wireless Chime Unit (White Receiver) on the right -->
  <g filter="url(#shadow)">
    <!-- White Body -->
    <rect x="300" y="200" width="110" height="130" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- EU Plug Prongs at back top / side -->
    <rect x="335" y="165" width="10" height="35" rx="3" fill="#64748b"/>
    <rect x="365" y="165" width="10" height="35" rx="3" fill="#64748b"/>
    
    <!-- Speaker Grill Matrix -->
    <g fill="#94a3b8">
      <circle cx="335" cy="245" r="2.5"/>
      <circle cx="355" cy="245" r="2.5"/>
      <circle cx="375" cy="245" r="2.5"/>
      
      <circle cx="325" cy="260" r="2.5"/>
      <circle cx="345" cy="260" r="2.5"/>
      <circle cx="365" cy="260" r="2.5"/>
      <circle cx="385" cy="260" r="2.5"/>
      
      <circle cx="335" cy="275" r="2.5"/>
      <circle cx="355" cy="275" r="3"/>
      <circle cx="375" cy="275" r="2.5"/>

      <circle cx="345" cy="290" r="2.5"/>
      <circle cx="365" cy="290" r="2.5"/>
    </g>

    <!-- Side Control Buttons -->
    <rect x="408" y="225" width="4" height="14" rx="2" fill="#cbd5e1"/>
    <rect x="408" y="245" width="4" height="14" rx="2" fill="#cbd5e1"/>
    <rect x="408" y="265" width="4" height="14" rx="2" fill="#cbd5e1"/>

    <!-- Tuya Indicator LED -->
    <circle cx="355" cy="310" r="3" fill="#38bdf8"/>
  </g>

  <!-- Product Label Badge -->
  <rect x="150" y="455" width="200" height="26" rx="8" fill="#0f172a"/>
  <text x="250" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Tuya Smart 1080P FHD + Chime
  </text>
</svg>
