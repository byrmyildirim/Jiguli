<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="gumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadowD" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="8" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="500" height="500" fill="url(#bgGradD)"/>

  <g filter="url(#shadowD)">
    <!-- Rear Metallic Articulator / Hinge -->
    <path d="M 80 180 L 150 180 L 170 320 L 80 320 Z" fill="url(#metalGrad)"/>
    <circle cx="115" cy="250" r="18" fill="#475569" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="115" cy="250" r="8" fill="#cbd5e1"/>
    
    <!-- Metal Adjustment Rods -->
    <rect x="90" y="140" width="16" height="60" rx="4" fill="url(#metalGrad)"/>
    <rect x="90" y="300" width="16" height="60" rx="4" fill="url(#metalGrad)"/>

    <!-- Upper Jaw (Maxilla) Base -->
    <path d="M 140 160 Q 280 100, 390 170 Q 420 200, 380 220 Q 280 170, 160 210 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Upper Pink Gum -->
    <path d="M 150 170 Q 270 120, 380 180 Q 390 195, 370 210 Q 270 160, 160 195 Z" fill="url(#gumGrad)"/>
    
    <!-- Upper 16 Teeth Arch -->
    <g fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5">
      <!-- Incisors & Canines -->
      <rect x="365" y="195" width="18" height="22" rx="4"/>
      <rect x="345" y="190" width="18" height="20" rx="4"/>
      <rect x="325" y="180" width="17" height="19" rx="4"/>
      <rect x="305" y="172" width="17" height="18" rx="4"/>
      <!-- Premolars & Molars -->
      <rect x="280" y="165" width="20" height="17" rx="4"/>
      <rect x="255" y="158" width="22" height="16" rx="4"/>
      <rect x="228" y="154" width="24" height="16" rx="4"/>
      <rect x="200" y="152" width="25" height="16" rx="4"/>
      <rect x="170" y="152" width="25" height="16" rx="4"/>
    </g>

    <!-- Lower Jaw (Mandible) Base -->
    <path d="M 140 340 Q 280 400, 390 330 Q 420 300, 380 280 Q 280 330, 160 290 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Lower Pink Gum -->
    <path d="M 150 330 Q 270 380, 380 320 Q 390 305, 370 290 Q 270 340, 160 305 Z" fill="url(#gumGrad)"/>

    <!-- Lower 16 Teeth Arch -->
    <g fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5">
      <!-- Incisors & Canines -->
      <rect x="365" y="275" width="18" height="22" rx="4"/>
      <rect x="345" y="280" width="18" height="20" rx="4"/>
      <rect x="325" y="290" width="17" height="19" rx="4"/>
      <rect x="305" y="298" width="17" height="18" rx="4"/>
      <!-- Premolars & Molars -->
      <rect x="280" y="305" width="20" height="17" rx="4"/>
      <rect x="255" y="312" width="22" height="16" rx="4"/>
      <rect x="228" y="316" width="24" height="16" rx="4"/>
      <rect x="200" y="318" width="25" height="16" rx="4"/>
      <rect x="170" y="318" width="25" height="16" rx="4"/>
    </g>
  </g>

  <!-- Product Label Badge -->
  <rect x="140" y="445" width="220" height="26" rx="8" fill="#0f172a"/>
  <text x="250" y="462" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">
    Model Stomatologiczny 32 Zęby
  </text>
</svg>
